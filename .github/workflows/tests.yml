name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke test package CLI
        run: |
          python -m skillfactory --version
          python -m skillfactory new --name ci-pkg-check --description "CI package check" --output "$RUNNER_TEMP/out"
          python -m skillfactory validate "$RUNNER_TEMP/out/ci-pkg-check"
          python -m skillfactory test "$RUNNER_TEMP/out/ci-pkg-check"
          python -m skillfactory eval "$RUNNER_TEMP/out/ci-pkg-check"
          python -m skillfactory scan "$RUNNER_TEMP/out/ci-pkg-check"

      - name: Smoke test legacy generator wrapper
        run: |
          python scripts/create_skill.py --name ci-check --description "CI smoke test" --output "$RUNNER_TEMP/out-legacy"
          test -f "$RUNNER_TEMP/out-legacy/ci-check/SKILL.md"
