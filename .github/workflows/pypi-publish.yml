name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run packaging and verification without uploading to PyPI"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify Distribution Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install build and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package archives with twine
        run: python -m twine check --strict dist/*

      - name: Smoke test package in isolated virtual environment
        run: |
          python -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install --upgrade pip
          /tmp/smoke_venv/bin/pip install dist/*.whl
          /tmp/smoke_venv/bin/skillfactory --version
          /tmp/smoke_venv/bin/skill-factory --version
          /tmp/smoke_venv/bin/skillfactory doctor
          /tmp/smoke_venv/bin/skillfactory search --tag automation

      - name: Upload build artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pypi-dist
          path: dist/
          retention-days: 7

  pypi-publish:
    name: Publish Distribution to PyPI (OIDC Trusted Publisher)
    needs: build-and-verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/skillfactory
    permissions:
      id-token: write # Mandatory for OIDC trusted publishing
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          print-hash: true
